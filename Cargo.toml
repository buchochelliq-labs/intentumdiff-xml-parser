[package]
name = "intentumdiff-xml-parser"
version = "0.1.0"
edition = "2021"
description = "XML parser plugin for IntentumDiff (full-parse mode)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.0.2-beta.1", features = ["ts-convert"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-xml = "0.7.0"
wit-bindgen = { version = "0.60", default-features = false, features = ["std", "macros"] }

[dev-dependencies]
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.0.2-beta.1", features = ["testing"] }

# Plugins target WASI p2 (Component Model); mirrors the monorepo's certified build profile.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Build scripts run on the host; compile them simply so Windows AppControl doesn't block them
[profile.release.build-override]
opt-level = 0
codegen-units = 16
debug = false

# Patch out or stabilize build scripts (vendored from the monorepo's crates/patches).
[patch.crates-io]
quote = { path = "patches/quote" }
zmij = { path = "patches/zmij" }
serde_core = { path = "patches/serde_core" }
serde_json = { path = "patches/serde_json" }
wit-bindgen-rust-macro = { path = "patches/wit-bindgen-rust-macro" }
tree-sitter = { path = "patches/tree-sitter" }
tree-sitter-xml = { path = "patches/tree-sitter-xml" }
